<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Archivo; src: url(../fonts/archivo-var.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125% }
* { margin: 0 } html, body { width: 838px; height: 220px; overflow: hidden }
body { position: relative; background: #f5f3ed; color: #5d5a54; font: 400 17px/1.4 Archivo, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 44px; border-top: 2px solid #e8735c; border-bottom: 2px solid #e8735c; box-sizing: border-box }
img { width: 300px; margin-left: -3px }
p { margin-top: 18px; font-size: 19px }
.sheet { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); display: grid; gap: 14px }
.r { display: flex; align-items: center; gap: 10px }
.r b { width: 30px; color: #b13f28; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums }
.r i { width: 34px; height: 24px; border-radius: 50%; border: 1.5px solid #e8735c; display: grid; place-items: center; font: normal 600 12px Archivo; font-stretch: 115%; color: #b13f28 }
.r i.on { background: #1d1c1a; border-color: #1d1c1a; color: #f5f3ed }
</style></head><body><img src="../logo/survay.svg" alt=""><p>One survey, one question at a time.</p><div class="sheet"><div class="r"><b>01</b><i>A</i><i>B</i><i>C</i><i class="on">D</i></div><div class="r"><b>02</b><i class="on">A</i><i>B</i><i>C</i><i>D</i></div><div class="r"><b>03</b><i>A</i><i class="on">B</i><i>C</i><i>D</i></div></div></body></html>
